<script>
function colorize(raw) {
  const KEYWORDS = ['SELECT','FROM','WHERE','JOIN','LEFT','INNER','ON','GROUP','BY','ORDER',
    'DESC','ASC','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE',
    'ALTER','DROP','RENAME','PRIMARY','KEY','AUTOINCREMENT','NOT','NULL','UNIQUE',
    'DEFAULT','CHECK','FOREIGN','REFERENCES','AND','OR','AS','COUNT','SUM','PRAGMA'];

  return raw.split('\n').map(line => {
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (/^\s*--/.test(esc)) return '<span class="cm">' + esc + '</span>';
    const ci = esc.indexOf('--');
    let code = ci >= 0 ? esc.slice(0, ci) : esc;
    const comment = ci >= 0 ? '<span class="cm">' + esc.slice(ci) + '</span>' : '';

    // Protect strings
    const strings = [];
    code = code.replace(/'[^']*'/g, m => { strings.push(m); return '\x00S' + (strings.length-1) + '\x00'; });

    // Keywords
    KEYWORDS.forEach(k => {
      code = code.replace(new RegExp('\\b' + k + '\\b', 'g'), '\x00K' + k + '\x00');
    });

    // Numbers (not inside hex colors or identifiers)
    code = code.replace(/(?<![#A-Za-z_])(\b\d+\b)(?![A-Za-z_])/g, '\x00N$1\x00');

    // Restore
    code = code
      .replace(/\x00K([A-Z]+)\x00/g, '<span class="kw">$1</span>')
      .replace(/\x00N(\d+)\x00/g, '<span class="nm">$1</span>')
      .replace(/\x00S(\d+)\x00/g, (_, i) => '<span class="st">' + strings[+i] + '</span>');

    return code + comment;
  }).join('\n');
}

const SCRIPT = `-- ============================================================
--  CREAR TABLAS
-- ============================================================
CREATE TABLE Estados (
    idEstado    INTEGER PRIMARY KEY AUTOINCREMENT,
    descripcion TEXT    NOT NULL UNIQUE
);

CREATE TABLE Departamentos (
    idDepartamento INTEGER PRIMARY KEY AUTOINCREMENT,
    nombre         TEXT    NOT NULL UNIQUE,
    presupuesto    REAL    NOT NULL CHECK (presupuesto >= 0),
    idEstado       INTEGER NOT NULL DEFAULT 1,
    FOREIGN KEY (idEstado) REFERENCES Estados(idEstado)
);

CREATE TABLE Empleados (
    idEmpleado     INTEGER PRIMARY KEY AUTOINCREMENT,
    idDepartamento INTEGER NOT NULL,
    nombre         TEXT    NOT NULL,
    apellido       TEXT    NOT NULL,
    ci             TEXT    NOT NULL UNIQUE,
    salario        REAL             CHECK (salario >= 0),
    fechaIngreso   TEXT             DEFAULT (DATE('now')),
    idEstado       INTEGER NOT NULL DEFAULT 1,
    UNIQUE (nombre, apellido),
    FOREIGN KEY (idDepartamento) REFERENCES Departamentos(idDepartamento),
    FOREIGN KEY (idEstado)       REFERENCES Estados(idEstado)
);

-- ============================================================
--  DATOS INICIALES
-- ============================================================
INSERT INTO Estados (descripcion) VALUES ('Activo');
INSERT INTO Estados (descripcion) VALUES ('Inactivo');

INSERT INTO Departamentos (nombre, presupuesto) VALUES ('Recursos Humanos', 50000);
INSERT INTO Departamentos (nombre, presupuesto) VALUES ('Tecnologia', 120000);
INSERT INTO Departamentos (nombre, presupuesto) VALUES ('Contabilidad', 75000);

INSERT INTO Empleados (idDepartamento, nombre, apellido, ci, salario, fechaIngreso)
    VALUES (1, 'Ana',   'Gonzalez', '1234567', 2500000, '2022-03-15');
INSERT INTO Empleados (idDepartamento, nombre, apellido, ci, salario, fechaIngreso)
    VALUES (2, 'Luis',  'Martinez', '2345678', 3800000, '2021-07-01');
INSERT INTO Empleados (idDepartamento, nombre, apellido, ci, salario, fechaIngreso)
    VALUES (2, 'Carla', 'Lopez',    '3456789', 4200000, '2020-11-20');
INSERT INTO Empleados (idDepartamento, nombre, apellido, ci, salario, fechaIngreso)
    VALUES (3, 'Pedro', 'Ramirez',  '4567890', 2900000, '2023-01-10');
INSERT INTO Empleados (idDepartamento, nombre, apellido, ci, salario, fechaIngreso)
    VALUES (1, 'Sofia', 'Benitez',  '5678901', 2700000, '2022-08-05');`;

const CAT_COLOR = {ddl:'#27AE60',dml:'#2980B9',select:'#8E44AD',restr:'#C0392B'};
const CAT_LABEL = {ddl:'DDL',dml:'DML',select:'SELECT',restr:'Restricciones'};

const EX = [
  {n:1,c:'ddl',t:'Agregar columna email (ADD COLUMN sin restricciones)',i:'En SQLite, ADD COLUMN no admite UNIQUE directamente. Agrega la columna email TEXT a Empleados sin UNIQUE.',s:`-- SQLite NO admite:\n-- ALTER TABLE Empleados ADD COLUMN email TEXT UNIQUE;\n\n-- Forma correcta:\nALTER TABLE Empleados ADD COLUMN email TEXT;`,p:'Si necesitas UNIQUE en email, deberas recrear la tabla completa.'},
  {n:2,c:'ddl',t:'Crear tabla Cargos',i:'Crea la tabla Cargos: idCargo PK AI, descripcion NN UQ, idEstado FK DEFAULT 1.',s:`CREATE TABLE Cargos (\n    idCargo     INTEGER PRIMARY KEY AUTOINCREMENT,\n    descripcion TEXT    NOT NULL UNIQUE,\n    idEstado    INTEGER NOT NULL DEFAULT 1,\n    FOREIGN KEY (idEstado) REFERENCES Estados(idEstado)\n);`,p:null},
  {n:3,c:'dml',t:"Insertar departamento 'Ventas'",i:"Inserta el departamento 'Ventas' con presupuesto 90000.",s:`INSERT INTO Departamentos (nombre, presupuesto)\n    VALUES ('Ventas', 90000);`,p:'idEstado toma DEFAULT 1 automaticamente.'},
  {n:4,c:'dml',t:'Insertar empleado en Tecnologia',i:'Inserta un empleado en idDepartamento = 2 con tus propios datos.',s:`INSERT INTO Empleados\n    (idDepartamento, nombre, apellido, ci, salario, fechaIngreso)\nVALUES\n    (2, 'TuNombre', 'TuApellido', '9999999', 3000000, '2026-05-25');`,p:'Reemplaza los valores con los tuyos.'},
  {n:5,c:'dml',t:'Actualizar presupuesto de Contabilidad',i:"Actualiza el presupuesto del departamento 'Contabilidad' a 85000.",s:`UPDATE Departamentos\nSET    presupuesto = 85000\nWHERE  nombre = 'Contabilidad';`,p:'Sin WHERE actualizaria TODOS los departamentos.'},
  {n:6,c:'dml',t:'Dar de baja un empleado (baja logica)',i:"Cambia el estado del empleado con CI '4567890' a Inactivo (idEstado = 2).",s:`UPDATE Empleados\nSET    idEstado = 2\nWHERE  ci = '4567890';`,p:null},
  {n:7,c:'dml',t:'Probar error: CI duplicada',i:"Intenta insertar un empleado con CI '1234567' (ya existe). Anota el error.",s:`INSERT INTO Empleados\n    (idDepartamento, nombre, apellido, ci, salario)\nVALUES\n    (1, 'Juan', 'Perez', '1234567', 2000000);\n\n-- Error esperado: UNIQUE constraint failed: Empleados.ci\n-- Anota el error exacto aqui:\n-- _______________________________________________`,p:'La restriccion UNIQUE en ci impide duplicados.'},
  {n:8,c:'select',t:'Empleados con su departamento',i:'Muestra nombre, apellido de cada empleado y el nombre de su departamento.',s:`SELECT e.nombre, e.apellido, d.nombre AS departamento\nFROM   Empleados e\nJOIN   Departamentos d ON e.idDepartamento = d.idDepartamento;`,p:null},
  {n:9,c:'select',t:'Empleados con su estado',i:'Muestra todos los empleados con la descripcion de su estado (Activo/Inactivo).',s:`SELECT e.nombre, e.apellido, est.descripcion AS estado\nFROM   Empleados e\nJOIN   Estados est ON e.idEstado = est.idEstado;`,p:null},
  {n:10,c:'select',t:"Empleados activos de Tecnologia",i:"Muestra solo empleados ACTIVOS del departamento 'Tecnologia'.",s:`SELECT e.nombre, e.apellido\nFROM   Empleados e\nJOIN   Departamentos d  ON e.idDepartamento = d.idDepartamento\nJOIN   Estados      est ON e.idEstado        = est.idEstado\nWHERE  d.nombre       = 'Tecnologia'\n  AND  est.descripcion = 'Activo';`,p:null},
  {n:11,c:'select',t:'Cantidad de empleados por departamento',i:'Muestra cada departamento y cuantos empleados tiene.',s:`SELECT d.nombre AS departamento,\n       COUNT(e.idEmpleado) AS cantidad_empleados\nFROM   Departamentos d\nLEFT JOIN Empleados e ON d.idDepartamento = e.idDepartamento\nGROUP BY d.idDepartamento, d.nombre;`,p:'LEFT JOIN incluye departamentos sin empleados.'},
  {n:12,c:'select',t:'Suma de salarios por departamento',i:'Muestra el nombre del departamento y la suma total de salarios.',s:`SELECT d.nombre AS departamento,\n       SUM(e.salario) AS total_salarios\nFROM   Departamentos d\nLEFT JOIN Empleados e ON d.idDepartamento = e.idDepartamento\nGROUP BY d.idDepartamento, d.nombre\nORDER BY total_salarios DESC;`,p:null},
  {n:13,c:'restr',t:'Error: FK inexistente (idEstado = 99)',i:'Activa PRAGMA foreign_keys e intenta insertar un departamento con idEstado = 99.',s:`PRAGMA foreign_keys = ON;\n\nINSERT INTO Departamentos (nombre, presupuesto, idEstado)\n    VALUES ('Marketing', 60000, 99);\n\n-- Error esperado: FOREIGN KEY constraint failed\n-- Anota el error exacto aqui:\n-- _______________________________________________`,p:'En SQLite las FK estan desactivadas por defecto. PRAGMA las activa.'},
  {n:14,c:'restr',t:'Error: salario negativo',i:'Intenta insertar un empleado con salario = -1000.',s:`INSERT INTO Empleados\n    (idDepartamento, nombre, apellido, ci, salario)\nVALUES\n    (1, 'Test', 'Error', '0000001', -1000);\n\n-- Error esperado: CHECK constraint failed: salario >= 0\n-- Anota el error exacto aqui:\n-- _______________________________________________`,p:null},
  {n:15,c:'restr',t:"Error: descripcion duplicada en Estados",i:"Intenta insertar un estado con la misma descripcion 'Activo'.",s:`INSERT INTO Estados (descripcion) VALUES ('Activo');\n\n-- Error esperado: UNIQUE constraint failed: Estados.descripcion\n-- Anota el error exacto aqui:\n-- _______________________________________________`,p:null},
];

const SOL = [
  {n:1,t:'ADD COLUMN sin UNIQUE inline',s:`-- INCORRECTO en SQLite:\n-- ALTER TABLE Empleados ADD COLUMN email TEXT UNIQUE;\n\n-- CORRECTO:\nALTER TABLE Empleados ADD COLUMN email TEXT;`,e:['SQLite no admite restricciones inline (UNIQUE, CHECK, FK) en ADD COLUMN.','La solucion es agregar la columna sin restriccion, o recrear la tabla completa.']},
  {n:2,t:'Crear tabla Cargos',s:`CREATE TABLE Cargos (\n    idCargo     INTEGER PRIMARY KEY AUTOINCREMENT,\n    descripcion TEXT    NOT NULL UNIQUE,\n    idEstado    INTEGER NOT NULL DEFAULT 1,\n    FOREIGN KEY (idEstado) REFERENCES Estados(idEstado)\n);`,e:['PK AUTOINCREMENT genera el ID automaticamente.','DEFAULT 1 deja el cargo como Activo si no se especifica estado.']},
  {n:3,t:'Insertar departamento',s:`INSERT INTO Departamentos (nombre, presupuesto)\n    VALUES ('Ventas', 90000);`,e:['idEstado toma DEFAULT 1 (Activo) automaticamente.']},
  {n:4,t:'Insertar empleado',s:`INSERT INTO Empleados\n    (idDepartamento, nombre, apellido, ci, salario, fechaIngreso)\nVALUES\n    (2, 'TuNombre', 'TuApellido', '9999999', 3000000, '2026-05-25');`,e:['idEstado toma DEFAULT 1. La CI debe ser unica en toda la tabla.']},
  {n:5,t:'Actualizar presupuesto',s:`UPDATE Departamentos\nSET    presupuesto = 85000\nWHERE  nombre = 'Contabilidad';`,e:['Sin WHERE actualizaria TODOS los departamentos. Siempre filtrar.']},
  {n:6,t:'Baja logica de empleado',s:`UPDATE Empleados\nSET    idEstado = 2\nWHERE  ci = '4567890';`,e:['Baja logica: el registro se mantiene, solo cambia su estado a Inactivo.']},
  {n:7,t:'CI duplicada',s:`-- Error: UNIQUE constraint failed: Empleados.ci`,e:['La restriccion UNIQUE en ci garantiza que cada empleado tenga un CI distinto.']},
  {n:8,t:'Empleados con departamento',s:`SELECT e.nombre, e.apellido, d.nombre AS departamento\nFROM   Empleados e\nJOIN   Departamentos d ON e.idDepartamento = d.idDepartamento;`,e:['INNER JOIN: solo muestra empleados que tienen departamento asignado.']},
  {n:9,t:'Empleados con estado',s:`SELECT e.nombre, e.apellido, est.descripcion AS estado\nFROM   Empleados e\nJOIN   Estados est ON e.idEstado = est.idEstado;`,e:['AS le da un alias a la columna para que sea mas legible.']},
  {n:10,t:'Activos de Tecnologia',s:`SELECT e.nombre, e.apellido\nFROM   Empleados e\nJOIN   Departamentos d  ON e.idDepartamento = d.idDepartamento\nJOIN   Estados      est ON e.idEstado        = est.idEstado\nWHERE  d.nombre       = 'Tecnologia'\n  AND  est.descripcion = 'Activo';`,e:['Doble JOIN: se une a dos tablas. WHERE filtra el resultado.']},
  {n:11,t:'Cantidad por departamento',s:`SELECT d.nombre AS departamento,\n       COUNT(e.idEmpleado) AS cantidad_empleados\nFROM   Departamentos d\nLEFT JOIN Empleados e ON d.idDepartamento = e.idDepartamento\nGROUP BY d.idDepartamento, d.nombre;`,e:['LEFT JOIN incluye departamentos sin empleados (muestra 0).','GROUP BY agrupa, COUNT() cuenta los registros de cada grupo.']},
  {n:12,t:'Suma de salarios',s:`SELECT d.nombre AS departamento,\n       SUM(e.salario) AS total_salarios\nFROM   Departamentos d\nLEFT JOIN Empleados e ON d.idDepartamento = e.idDepartamento\nGROUP BY d.idDepartamento, d.nombre\nORDER BY total_salarios DESC;`,e:['SUM() suma todos los salarios del grupo.','ORDER BY ... DESC ordena de mayor a menor.']},
  {n:13,t:'FK inexistente',s:`PRAGMA foreign_keys = ON;\n-- Error: FOREIGN KEY constraint failed`,e:['PRAGMA foreign_keys = ON activa la verificacion de FK (off por defecto en SQLite).','El error impide referenciar un idEstado que no existe en Estados.']},
  {n:14,t:'Salario negativo',s:`-- Error: CHECK constraint failed: salario >= 0`,e:['La restriccion CHECK (salario >= 0) impide valores negativos en la columna.']},
  {n:15,t:'Descripcion duplicada',s:`-- Error: UNIQUE constraint failed: Estados.descripcion`,e:['UNIQUE en la columna impide insertar dos estados con el mismo nombre.']},
];

document.getElementById('script-pre').innerHTML = colorize(SCRIPT);

document.getElementById('ex-list').innerHTML = EX.map(ex => `
  <div class="ex-card" data-cat="${ex.c}">
    <div style="background:#C45000;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="background:#fff;color:#C45000;font-weight:700;font-size:13px;border-radius:6px;padding:2px 10px">Ej ${ex.n}</span>
      <span style="color:#fff;font-weight:600;font-size:14px;flex:1">${ex.t}</span>
      <span style="background:${CAT_COLOR[ex.c]};color:#fff;font-size:11px;border-radius:10px;padding:2px 10px;font-weight:600">${CAT_LABEL[ex.c]}</span>
    </div>
    <div style="background:#FDE8D8;padding:10px 16px;font-size:13px;color:#7a3000;border-bottom:1px solid #e8c8a0">${ex.i}</div>
    <div class="code-block"><pre class="sql">${colorize(ex.s)}</pre></div>
    ${ex.p ? `<div style="background:#fff8f0;border-left:4px solid #E8650A;padding:8px 16px;font-size:12px;color:#7a3000;font-style:italic">Pista: ${ex.p}</div>` : ''}
  </div>
`).join('');

document.getElementById('sol-list').innerHTML = SOL.map(s => `
  <div class="sol-card">
    <div style="background:#1E5C2E;padding:10px 16px;display:flex;align-items:center;gap:10px">
      <span style="background:#fff;color:#1E5C2E;font-weight:700;font-size:13px;border-radius:6px;padding:2px 10px">Ej ${s.n}</span>
      <span style="color:#fff;font-weight:600;font-size:14px">&#10003; ${s.t}</span>
    </div>
    <div class="code-block"><pre class="sql">${colorize(s.s)}</pre></div>
    <div style="background:#E8F5EC;padding:10px 16px;border-top:1px solid #b8dcc4">
      <div style="font-size:12px;font-weight:700;color:#1E5C2E;margin-bottom:4px">Explicacion:</div>
      ${s.e.map(x=>`<div style="font-size:12.5px;color:#1a4a28;margin-bottom:2px">• ${x}</div>`).join('')}
    </div>
  </div>
`).join('');

function showSection(s){
  ['script','ejercicios','soluciones'].forEach(id=>{
    document.getElementById('sec-'+id).style.display = id===s?'block':'none';
    const b = document.getElementById('tab-'+id);
    b.style.background = id===s?'#fff':'#fff3';
    b.style.color = id===s?'#C45000':'#fff';
    b.style.fontWeight = id===s?'700':'600';
  });
}

function filterEx(cat){
  document.querySelectorAll('.filt-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-f')===cat));
  document.querySelectorAll('.ex-card').forEach(c => {
    c.style.display = (cat==='all'||c.getAttribute('data-cat')===cat)?'block':'none';
  });
}

function copyScript(){
  navigator.clipboard.writeText(SCRIPT).then(()=>{
    const ok=document.getElementById('copy-ok');
    ok.style.display='inline';
    setTimeout(()=>ok.style.display='none',2000);
  });
}
</script>
